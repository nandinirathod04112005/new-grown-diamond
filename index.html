<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="New Grown Diamond — lab-grown diamonds and fine jewellery, grown and cut in Surat." />
    <title>New Grown Diamond</title>
    <!--
      Applied before the first paint, or the page renders in the wrong theme
      for a frame and flashes. It has to be inline and synchronous for the same
      reason: a module script runs too late to beat the first paint.

      Dark is the authored default; a stored visitor choice still wins.
    -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('ngd-theme');
          if (saved === 'light' || saved === 'dark') t = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
