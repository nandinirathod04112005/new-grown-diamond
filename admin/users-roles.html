<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Users & Roles — New Grown Diamond</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<!-- Fail closed until the shared active-admin guard succeeds. -->
<body class="ngd-backdrop" style="visibility:hidden">
  <header class="ngd-dash-topbar">
    <a class="ngd-brand" href="dashboard.html"><span class="ngd-brand-mark">◆</span> New Grown Diamond</a>
    <span class="ngd-eyebrow d-none d-md-inline ms-2">Admin console</span>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <span class="d-none d-sm-flex flex-column text-end lh-sm">
        <strong class="small" data-ngd-field="full_name">&mdash;</strong>
        <span class="ngd-text-muted" style="font-size:.72rem" data-ngd-field="email">&mdash;</span>
      </span>
      <span class="ngd-badge ngd-badge-dark d-none d-md-inline-flex" data-ngd-field="role">&mdash;</span>
      <button type="button" class="ngd-btn ngd-btn-outline ngd-btn-sm" data-ngd-logout>Sign out</button>
    </div>
  </header>
  <main class="container py-5">
    <a class="ngd-link" href="dashboard.html">← Admin Dashboard</a>
    <section class="ngd-card p-4 p-md-5 mt-4">
      <span class="ngd-eyebrow">Admin console</span>
      <h1 class="ngd-display-2 mt-2">Users & Roles</h1>
      <p class="ngd-text-muted mb-0">Role management will be added in a later backend step. There is no public admin signup.</p>
    </section>
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script defer src="../assets/js/supabase-config.js"></script>
  <script defer src="../assets/js/supabase-client.js"></script>
  <script defer src="../assets/js/auth-guard.js"></script>
  <script defer src="../assets/js/admin-page.js"></script>
</body>
</html>
